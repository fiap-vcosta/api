name: CI

on:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      errors: ${{ steps.inspect_summary.outputs.errors }}
      warnings: ${{ steps.inspect_summary.outputs.warnings }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json', '.config/dotnet-tools.json', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: |
          dotnet restore TechChallenge.sln
          dotnet tool restore

      - name: Build
        run: |
          dotnet build TechChallenge.sln -c Release --no-restore \
            /p:EnableNETAnalyzers=false \
            /p:EnforceCodeStyleInBuild=false \
            /p:RunAnalyzersDuringBuild=false

      - name: InspectCode
        run: |
          dotnet tool run jb inspectcode TechChallenge.sln \
            --no-build \
            --severity=WARNING \
            --output=inspectcode.sarif.json \
            --format=Sarif \
            --verbosity=WARN

      - name: Summarize InspectCode results
        id: inspect_summary
        run: |
          set -euo pipefail
          REPORT=inspectcode.sarif.json
          if [ ! -f "$REPORT" ]; then
            echo "InspectCode report not found: $REPORT"
            exit 1
          fi

          ERRORS=$(jq '[.runs[].results[]? | select((.level // "warning") == "error")] | length' "$REPORT")
          WARNINGS=$(jq '[.runs[].results[]? | select((.level // "warning") == "warning")] | length' "$REPORT")
          NOTES=$(jq '[.runs[].results[]? | select((.level // "warning") == "note" or (.level // "") == "none")] | length' "$REPORT")

          {
            echo "## InspectCode"
            echo ""
            echo "| Severity | Count |"
            echo "|----------|------:|"
            echo "| Error | ${ERRORS} |"
            echo "| Warning | ${WARNINGS} |"
            echo "| Note/other | ${NOTES} |"
            echo ""
            echo "Detalhes no artifact \`inspectcode-report\` (SARIF)."
            if [ "$ERRORS" -gt 0 ]; then
              echo ""
              echo "### Errors (sample)"
              echo ""
              jq -r '.runs[].results[]? | select((.level // "warning") == "error") | "- `\(.ruleId // "unknown")`: \(.message.text // .message // "")"' "$REPORT" | head -50 || true
            fi
            if [ "$WARNINGS" -gt 0 ]; then
              echo ""
              echo "### Warnings (sample)"
              echo ""
              jq -r '.runs[].results[]? | select((.level // "warning") == "warning") | "- `\(.ruleId // "unknown")`: \(.message.text // .message // "")"' "$REPORT" | head -30 || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          echo "errors=${ERRORS}" >> "$GITHUB_OUTPUT"
          echo "warnings=${WARNINGS}" >> "$GITHUB_OUTPUT"

          if [ "$ERRORS" -gt 0 ]; then
            echo "::error::InspectCode found ${ERRORS} error(s). See Job Summary / artifact."
          fi

          if [ "$WARNINGS" -gt 0 ]; then
            echo "::warning::InspectCode found ${WARNINGS} warning(s). Review the Job Summary / artifact."
          fi

      - name: Upload InspectCode report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: inspectcode-report
          path: inspectcode.sarif.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Mark Lint as warning (yellow job)
        if: steps.inspect_summary.outputs.errors != '0' || steps.inspect_summary.outputs.warnings != '0'
        run: |
          echo "Failing Lint job so Actions shows it as yellow (continue-on-error on job)."
          exit 1

  lint-errors:
    name: Lint errors
    needs: lint
    if: always() && needs.lint.outputs.errors != '0' && needs.lint.outputs.errors != ''
    runs-on: ubuntu-latest
    steps:
      - name: Fail workflow on InspectCode errors
        run: |
          echo "::error::Lint reported ${{ needs.lint.outputs.errors }} error(s). Fix them before continuing."
          exit 1

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json', '.config/dotnet-tools.json', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: |
          dotnet restore TechChallenge.sln
          dotnet tool restore

      - name: Run unit tests with coverage gate
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/test-results/coverage"
          dotnet test tests/UnitTests/UnitTests.csproj \
            -c Release \
            --no-restore \
            /p:EnableNETAnalyzers=false \
            /p:EnforceCodeStyleInBuild=false \
            /p:RunAnalyzersDuringBuild=false \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=cobertura \
            /p:CoverletOutput="${GITHUB_WORKSPACE}/test-results/coverage/coverage" \
            '/p:Exclude=[*]*Migrations.*' \
            /p:Threshold=80 \
            /p:ThresholdType=line%2Cbranch \
            /p:ThresholdStat=minimum

      - name: Generate coverage report
        if: always()
        run: |
          dotnet tool run reportgenerator \
            "-reports:${GITHUB_WORKSPACE}/test-results/coverage/**/*.cobertura.xml;${GITHUB_WORKSPACE}/test-results/coverage/coverage.cobertura.xml" \
            "-targetdir:${GITHUB_WORKSPACE}/test-results/coverage-report" \
            "-reporttypes:Html;MarkdownSummaryGithub;TextSummary" \
            "-title:Unit test coverage"

      - name: Write coverage Job Summary
        if: always()
        run: |
          if [ -f ./test-results/coverage-report/SummaryGithub.md ]; then
            cat ./test-results/coverage-report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
          elif [ -f ./test-results/coverage-report/Summary.txt ]; then
            {
              echo "## Unit test coverage"
              echo ""
              echo '```'
              cat ./test-results/coverage-report/Summary.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Coverage summary not found." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: test-results/coverage-report/
          if-no-files-found: warn
          retention-days: 1

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json', '.config/dotnet-tools.json', 'global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore TechChallenge.sln

      - name: Run integration tests
        run: |
          dotnet test tests/IntegrationTests/IntegrationTests.csproj \
            -c Release \
            --no-restore \
            /p:EnableNETAnalyzers=false \
            /p:EnforceCodeStyleInBuild=false \
            /p:RunAnalyzersDuringBuild=false \
            --logger "console;verbosity=normal"
