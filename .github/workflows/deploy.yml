name: deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  K8S_NAMESPACE: tech-challenge
  DB_NAME: techchallenge
  DB_USER: api

jobs:
  deploy:
    name: Deploy no GKE
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check required org vars
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_AR_REPOSITORY: ${{ vars.GCP_AR_REPOSITORY }}
          GCP_GKE_CLUSTER_NAME: ${{ vars.GCP_GKE_CLUSTER_NAME }}
          GCP_DB_PASSWORD_SECRET: ${{ vars.GCP_DB_PASSWORD_SECRET }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT_EMAIL: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}
        run: |
          missing=()
          for name in GCP_PROJECT_ID GCP_REGION GCP_AR_REPOSITORY GCP_GKE_CLUSTER_NAME \
                      GCP_DB_PASSWORD_SECRET GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT_EMAIL; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "org vars faltando: ${missing[*]}" >&2
            exit 1
          fi

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Credenciais do cluster
        run: |
          gcloud container clusters get-credentials "${{ vars.GCP_GKE_CLUSTER_NAME }}" \
            --region "${{ vars.GCP_REGION }}" --dns-endpoint

      - name: Namespace e service account
        run: kubectl apply -f k8s/namespace.yaml -f k8s/serviceaccount.yaml

      - name: Secret da aplicação
        env:
          DB_PASSWORD_SECRET: ${{ vars.GCP_DB_PASSWORD_SECRET }}
          JWT_CLIENTE_KEY: ${{ secrets.JWT_CLIENTE_KEY }}
          SERVICE_AUTH_KEY: ${{ secrets.SERVICE_AUTH_KEY }}
          DD_API_KEY: ${{ secrets.DD_API_KEY }}
        run: |
          missing=()
          for name in JWT_CLIENTE_KEY SERVICE_AUTH_KEY DD_API_KEY; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "repo/org secrets faltando: ${missing[*]}" >&2
            exit 1
          fi

          db_password="$(gcloud secrets versions access latest --secret="$DB_PASSWORD_SECRET")"
          JWT_FUNCIONARIO_KEY="$(openssl rand -base64 48)"
          echo "::add-mask::$db_password"
          echo "::add-mask::$JWT_FUNCIONARIO_KEY"

          kubectl create secret generic api \
            --namespace "$K8S_NAMESPACE" \
            --from-literal=ConnectionStrings__DefaultConnection="Host=127.0.0.1;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${db_password}" \
            --from-literal=JwtFuncionario__Key="$JWT_FUNCIONARIO_KEY" \
            --from-literal=JwtCliente__Key="$JWT_CLIENTE_KEY" \
            --from-literal=ServiceAuth__Key="$SERVICE_AUTH_KEY" \
            --from-literal=DD_API_KEY="$DD_API_KEY" \
            --dry-run=client -o yaml \
          | kubectl apply -f -

      - name: Aplicar manifests
        env:
          IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPOSITORY }}/api:latest
          DD_SITE: ${{ vars.DD_SITE }}
          DD_VERSION: ${{ github.sha }}
        run: |
          export IMAGE DD_VERSION
          export DD_SITE="${DD_SITE:-datadoghq.com}"
          envsubst '${DD_SITE}' < k8s/configmap.yaml > configmap.rendered.yaml
          envsubst '${IMAGE} ${DD_VERSION}' < k8s/deployment.yaml > deployment.rendered.yaml
          kubectl apply \
            -f configmap.rendered.yaml \
            -f deployment.rendered.yaml \
            -f k8s/service.yaml \
            -f k8s/managedcertificate.yaml \
            -f k8s/ingress.yaml \
            -f k8s/hpa.yaml
          # JwtFuncionario__Key é regenerada a cada deploy: sem restart os pods seguem com a antiga
          kubectl rollout restart deployment/api --namespace "$K8S_NAMESPACE"
          kubectl rollout status deployment/api --namespace "$K8S_NAMESPACE" --timeout=10m

      - name: Smoke HTTPS nomeado
        env:
          API_HOST: api.vcosta-fiap.online
        run: |
          health_url="https://${API_HOST}/health"
          # Cert gerenciado pode levar vários minutos após o A apontar para o IP estático.
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 10 "$health_url" >/dev/null; then
              {
                echo "## API no ar"
                echo ""
                echo "- Health: $health_url"
                echo "- Swagger: https://${API_HOST}/swagger"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 15
          done

          echo "Smoke HTTPS falhou após ~15 min: $health_url" >&2
          echo "Confira: A de api → IP estático tech-challenge-api; ManagedCertificate Active; Ingress." >&2
          kubectl describe managedcertificate api --namespace "$K8S_NAMESPACE" >&2 || true
          kubectl describe ingress api --namespace "$K8S_NAMESPACE" >&2 || true
          exit 1
